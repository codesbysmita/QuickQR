<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickQR</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button class="toggle-mode" id="toggleMode">🌙 Dark</button>
  <h1>QuickQR</h1>

  <div class="container">
    <input id="textInput" type="text" placeholder="Enter text or link here..." />
    <label for="colorPicker">Choose QR color:</label>
    <input type="color" id="colorPicker" value="#000000" />
    <button id="generateBtn">Generate QR</button>

    <div class="qr-container">
      <div id="qrCode"></div>
      <button id="downloadBtn">Download QR</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
